name: Verificar segundo parcial
on:
  workflow_dispatch:
  push:
    branches: [main, correcciones-entrega-2]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas automatizadas
        run: python -m pytest -q
      - name: Recuperar modelo registrado
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/giselle.san/entregaPrimerParcial.mlflow
          MODEL_NAME: customer-churn-candidate
          MODEL_VERSION: '4'
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m scripts.fetch_model
      - name: Construir y levantar con Docker Compose
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180 -d
      - name: Comprobar servicio y predicción real
        run: |
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://localhost:8000/health', timeout=10) as response:
              health = json.load(response)
          assert health['status'] == 'healthy'
          assert health['model_version'] == '4'
          payload = open('examples/customer.json', 'rb').read()
          request = urllib.request.Request('http://localhost:8000/predict', data=payload,
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=10) as response:
              prediction = json.load(response)
          assert prediction['model_version'] == health['model_version']
          assert 0 <= prediction['probability'] <= 1
          assert prediction['prediction'] in ('CHURN', 'NO_CHURN')
          assert prediction['risk_level'] in ('LOW', 'MEDIUM', 'HIGH')
          print(json.dumps({'health': health, 'prediction': prediction}, indent=2))
          PY
      - name: Logs y limpieza
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
