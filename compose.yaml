services:
  churn-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/churn_pipeline.joblib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
