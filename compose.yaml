services:
  churn-api:
    build: .
    ports:
      - "8000:8000"
    container_name: churn-api
    environment:
      MODEL_PATH: /app/models/churn_pipeline.joblib
      MODEL_VERSION_PATH: /app/models/version.txt
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
